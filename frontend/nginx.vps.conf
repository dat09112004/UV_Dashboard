# Cấu hình Nginx Production chuẩn HTTPS cho Uyên Vũ ERP (SEC-07, DOS-01 & DOS-02 Fix)
# - Chỉ định riêng hostname ERP (erp.uyenvu-international.com), KHÔNG gộp domain website chính (uyenvu-international.com).
# - Bổ sung limit_req_zone và limit_conn_zone chống quá tải lớp reverse proxy (DOS-01).
# - Giới hạn truy cập endpoint readiness (/api/v1/health) chỉ cho mạng nội bộ/monitor (DOS-02).

limit_req_zone $binary_remote_addr zone=uv_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=uv_export_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=uv_api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=uv_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name erp.uyenvu-international.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.uyenvu-international.com;

    # Đường dẫn chứng chỉ TLS/SSL cho hostname ERP trên VPS (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/erp.uyenvu-international.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.uyenvu-international.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # SEC-07 Fix: Bổ sung HSTS, CSP và các HTTP Security Headers cho ứng dụng React SPA trên vhost HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DOS-01 Fix: Giới hạn kết nối đồng thời và timeout đọc header/body chống Slowloris
    limit_conn uv_conn_limit 20;
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 2m;

    root /var/www/uyenvu-erp/dist;
    index index.html;

    # DOS-02 Fix: Chặn truy cập công khai từ Internet vào endpoint kiểm tra readiness chuyên sâu
    location = /api/v1/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness probe nhẹ có áp giới hạn tần suất
    location = /api/v1/health/live {
        limit_req zone=uv_api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # DOS-01 Fix: Giới hạn chặt nhóm xác thực (/api/v1/auth/) với body tối đa 64 KB
    location /api/v1/auth/ {
        limit_req zone=uv_auth_limit burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # DOS-01 Fix: Giới hạn nhóm xuất báo cáo (/api/v1/export/ và /api/v1/reports/)
    location ~ ^/api/v1/(export|reports)/ {
        limit_req zone=uv_export_limit burst=4 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # DOS-01 Fix: Cho phép body 6 MB riêng cho nhập liệu lô & đính kèm tệp công việc
    location ~ ^/api/v1/(data-entry|operations/tasks) {
        limit_req zone=uv_api_limit burst=20 nodelay;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy REST API chung về Node.js loopback (không mở cổng 4000 ra Internet)
    location /api/ {
        limit_req zone=uv_api_limit burst=40 nodelay;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
