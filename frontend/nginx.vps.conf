# Cấu hình Nginx Production chuẩn HTTPS cho Uyên Vũ ERP (Mục 02 & D01 - QA v1.1.0 Bản 3)
# - Chỉ định riêng hostname ERP (erp.uyenvu-international.com), KHÔNG gộp domain website chính (uyenvu-international.com)
#   để tránh xung đột vhost với landing page công ty.
# - Đảm bảo CORS_ORIGIN=https://erp.uyenvu-international.com và TRUST_PROXY=true trong .env của Backend.
# - Phục vụ trực tiếp gói giao diện tĩnh (FE dist) và reverse-proxy /api/ cùng origin về Node.js loopback (127.0.0.1:4000).

server {
    listen 80;
    listen [::]:80;
    server_name erp.uyenvu-international.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.uyenvu-international.com;

    # Đường dẫn chứng chỉ TLS/SSL cho hostname ERP trên VPS (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/erp.uyenvu-international.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.uyenvu-international.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/uyenvu-erp/dist;
    index index.html;

    client_max_body_size 10m;

    # Proxy REST API cùng origin về Node.js loopback (không mở cổng 4000 ra Internet)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
